<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nakheel Optics — WhatsApp Bot Simulator (Concept)</title>
    <meta name="description" content="Concept project: a WhatsApp Cloud API bot (order tracking and appointment booking) running its real state machine in a phone simulator, with the exact API payloads shown." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%230b4f4a'/%3E%3Cpath d='M9 22l2-5a7 7 0 1 1 3 3z' fill='%23d3f1e4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Cairo:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-D7c-mSkO.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CLI4jIcA.css">
  </head>
  <body>
    <main class="page">
      <section class="intro">
        <div class="top">
          <span class="badge" data-i18n="badge"></span>
          <button id="langBtn" class="lang" type="button"></button>
        </div>
        <h1 data-i18n="title"></h1>
        <p class="lede" data-i18n="lede"></p>
        <ul class="points">
          <li data-i18n="p1"></li>
          <li data-i18n="p2"></li>
          <li data-i18n="p3"></li>
          <li data-i18n="p4"></li>
        </ul>
        <p class="try" data-i18n="tryLabel"></p>
        <div class="chips" id="chips"></div>
        <button id="reset" class="reset" type="button" data-i18n="reset"></button>
      </section>

      <section class="phone-wrap" aria-label="Chat simulator">
        <div class="phone">
          <div class="notch" aria-hidden="true"></div>
          <header class="chat-head">
            <span class="avatar" aria-hidden="true">N</span>
            <div><b data-i18n="biz"></b><small data-i18n="bizSub"></small></div>
          </header>
          <div class="chat" id="chat" role="log" aria-live="polite"></div>
          <form class="composer" id="composer">
            <label class="sr" for="msg" data-i18n="placeholder"></label>
            <input id="msg" autocomplete="off" />
            <button type="submit" aria-label="Send"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6v6.5L15 12 3.4 13.9z"/></svg></button>
          </form>
          <div class="sheet" id="sheet" hidden>
            <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
              <div class="sheet-head"><button type="button" id="sheetClose" aria-label="Close">✕</button><b id="sheetTitle"></b></div>
              <div id="sheetBody"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="dev" aria-label="Developer view">
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="out" aria-selected="true" data-i18n="tabOut"></button>
          <button role="tab" data-tab="in" aria-selected="false" data-i18n="tabIn"></button>
          <button role="tab" data-tab="state" aria-selected="false" data-i18n="tabState"></button>
        </div>
        <p class="dev-note" id="devNote"></p>
        <pre id="code" dir="ltr" tabindex="0"></pre>
      </section>
    </main>
    <footer class="foot"><span class="pill">Concept</span><span data-i18n="footer"></span></footer>
  </body>
</html>
