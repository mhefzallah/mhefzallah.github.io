<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fatoora Lens — Saudi VAT Invoice Extractor (Concept)</title>
    <meta name="description" content="Concept project: in-browser OCR (Arabic + English) and ZATCA QR decoding that extracts Saudi VAT invoice fields into an editable table with JSON/CSV export." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2311151a'/%3E%3Cpath d='M9 7h10l5 5v13H9z' fill='none' stroke='%23c8f169' stroke-width='2.4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-CROSGAxk.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CeE8u3y6.css">
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#c8f169"/><path d="M9 7h10l5 5v13H9z" fill="none" stroke="#11151a" stroke-width="2.4" stroke-linejoin="round"/><path d="M12 16h8M12 20h5" stroke="#11151a" stroke-width="2.4" stroke-linecap="round"/></svg>
        <div><strong data-i18n="brand"></strong><span data-i18n="tagline"></span></div>
      </div>
      <span class="badge" data-i18n="badge"></span>
      <button id="langBtn" class="lang" type="button"></button>
    </header>

    <section class="intake" aria-labelledby="samplesTitle">
      <h2 id="samplesTitle" class="label" data-i18n="samples"></h2>
      <div class="samples" id="samples"></div>
      <label class="drop" id="drop">
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp,application/pdf" />
        <span class="drop-ico" aria-hidden="true">⤓</span>
        <span><b data-i18n="dropTitle"></b><small data-i18n="dropHint"></small></span>
      </label>
    </section>

    <main class="work">
      <section class="viewer" aria-label="Document">
        <div class="viewer-head"><span id="docName" class="mono">—</span><span id="docKind" class="chip"></span></div>
        <div class="stage" id="stage">
          <div class="placeholder" id="placeholder" data-i18n="pick"></div>
          <div class="doc" id="doc" hidden>
            <canvas id="canvas"></canvas>
            <svg id="overlay" class="overlay" aria-hidden="true"></svg>
            <div class="scan" id="scan" hidden></div>
          </div>
        </div>
      </section>

      <section class="results" aria-label="Results">
        <ol class="steps" id="steps"></ol>
        <div class="progress" id="progressWrap" hidden><span id="progress"></span></div>

        <div class="card">
          <div class="card-head"><h3 data-i18n="fields"></h3><span class="muted" data-i18n="editHint"></span></div>
          <table class="fields">
            <thead><tr><th data-i18n="thField"></th><th data-i18n="thValue"></th><th data-i18n="thConf"></th></tr></thead>
            <tbody id="fieldRows"></tbody>
          </table>
        </div>

        <div class="card">
          <h3 data-i18n="checks"></h3>
          <ul class="checks" id="checks"><li class="muted" data-i18n="noChecks"></li></ul>
        </div>

        <div class="actions">
          <button id="dlJson" class="btn" type="button" disabled data-i18n="exportJson"></button>
          <button id="dlCsv" class="btn ghost" type="button" disabled data-i18n="exportCsv"></button>
        </div>

        <details class="card raw"><summary data-i18n="rawText"></summary><pre id="raw" dir="auto"></pre></details>

        <details class="card llm">
          <summary data-i18n="llmTitle"></summary>
          <p class="muted" data-i18n="llmHelp"></p>
          <form id="llmForm" class="llm-form">
            <label class="sr" for="llmKey" data-i18n="apiKey"></label>
            <input id="llmKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" />
            <button class="btn ghost" type="submit" data-i18n="llmRun"></button>
          </form>
          <p id="llmOut" class="muted" role="status"></p>
        </details>
      </section>
    </main>

    <footer class="foot"><span class="pill">Concept</span> <span data-i18n="footer"></span></footer>
  </body>
</html>
